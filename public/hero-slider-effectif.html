    /* Custom Tailwind Theme Colors & Typography */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#0A0A0A',
            anthracite: '#1A1A1A',
            goldmetal: '#D4AF37',
            neongreen: '#00FF66'
          },
          fontFamily: {
            display: ['"Barlow Condensed"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }

  <style>
    /* Smooth Slide Reveal & Progress Bar Animations */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #0f172a;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    @keyframes slideRevealUp {
      0% {
        opacity: 0;
        transform: translate3d(0, 26px, 0);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes playerPhotoEnter {
      0% {
        opacity: 0;
        transform: translate3d(34px, 0, 0) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    .anim-reveal-1 { animation: slideRevealUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .anim-reveal-2 { animation: slideRevealUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both; }
    .anim-reveal-3 { animation: slideRevealUp 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both; }
    .anim-photo-in { animation: playerPhotoEnter 0.65s cubic-bezier(0.16, 1, 0.3, 1) both; }

    .stat-bar-fill {
      transform-origin: left center;
      transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .player-photo-frame {
      border-radius: 1.25rem;
      border: 2px solid #e2e8f0;
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.14);
      background-color: #f8fafc;
    }

    #simolatHeroSlider:fullscreen,
    #simolatHeroSlider:-webkit-full-screen,
    #simolatHeroSlider.theater-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      overflow-y: auto;
      background-color: #ffffff;
    }

    #paginationContainer {
      scrollbar-width: thin;
      scrollbar-color: rgba(180, 83, 9, 0.45) transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      .anim-reveal-1, .anim-reveal-2, .anim-reveal-3, .anim-photo-in {
        animation: none !important;
      }
      .stat-bar-fill {
        transition: none !important;
      }
    }
  </style>
</head>
<body class="bg-white text-slate-900 antialiased selection:bg-emerald-600 selection:text-white">

  <!-- =========================================================================
       HERO SLIDER MAIN CONTAINER (100vw x min-h-[85vh])

    </footer>

        number: "21",
        position: "Right Back (RB)",
        age: 20,
        preferredFoot: "Right",
        nationality: "Ghana",
        photoUrl: "/players/defender.webp",
        stats: { pace: 87, dribbling: 80, shooting: 72 }
      },
      {
        firstName: "Kehinde",
        lastName: "Bakare",
        number: "22",
        position: "Left Winger (LW)",
        age: 18,
        preferredFoot: "Right",
        nationality: "Nigeria",
        photoUrl: "/players/winger.webp",
        stats: { pace: 93, dribbling: 90, shooting: 83 }
      },
      {
        firstName: "Damilola",
        lastName: "Salami",
        number: "23",
        position: "Goalkeeper (GK)",
        age: 19,
        preferredFoot: "Left",
        nationality: "Nigeria",
        photoUrl: "/players/goalkeeper.webp",
        stats: { pace: 75, dribbling: 67, shooting: 70 }
      }
    ];

    /* =========================================================================
       2. HERO SLIDER INITIALIZATION & CONTROLLER
       ========================================================================= */
    (function () {
      const sliderEl = document.getElementById("simolatHeroSlider");
      const slideContentEl = document.getElementById("sliderSlideContent");
      const paginationEl = document.getElementById("paginationContainer");
      const counterLabelEl = document.getElementById("slideCounterLabel");
      const btnPrev = document.getElementById("btnPrevPlayer");
      const btnNext = document.getElementById("btnNextPlayer");
      const btnAutoplay = document.getElementById("btnToggleAutoplay");
      const btnFullscreen = document.getElementById("btnToggleFullscreen");
      const btnExportPdf = document.getElementById("btnExportSquadPdf");
      const btnExportPdfLabel = document.getElementById("btnExportSquadPdfLabel");

      const elPosition = document.getElementById("playerPosition");
      const elShirtTag = document.getElementById("playerShirtTag");
      const elFirstName = document.getElementById("playerFirstName");
      const elLastName = document.getElementById("playerLastName");
      const elAge = document.getElementById("playerAge");
      const elFoot = document.getElementById("playerFoot");
      const elNationality = document.getElementById("playerNationality");
      const elWatermark = document.getElementById("playerWatermarkNumber");
      const elPhotoImg = document.getElementById("playerPhotoImg");
      const elPhotoWrap = document.getElementById("playerPhotoWrap");

      const elSpeedVal = document.getElementById("statSpeedVal");
      const elSpeedBar = document.getElementById("statSpeedBar");
      const elDribbleVal = document.getElementById("statDribbleVal");
      const elDribbleBar = document.getElementById("statDribbleBar");
      const elShotVal = document.getElementById("statShotVal");
      const elShotBar = document.getElementById("statShotBar");

      let currentIndex = 0;
      let autoplayEnabled = true;
      let isHovered = false;
      let autoplayTimer = null;
      const AUTOPLAY_INTERVAL_MS = 5500;
      const preloadedUrls = new Set();

      let touchStartX = 0;
      let touchStartY = 0;

      function preloadPhoto(url) {
        if (!url || preloadedUrls.has(url)) return;
        preloadedUrls.add(url);
        const img = new Image();
        img.src = url;
      }

      function buildPagination() {
        paginationEl.innerHTML = "";
        SIMOLAT_SQUAD.forEach((player, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.dataset.index = String(idx);
          btn.setAttribute("aria-label", `Show ${player.firstName} ${player.lastName}`);
          btn.className = "group flex flex-col items-center gap-1 px-1.5 py-1 rounded-md transition-colors cursor-pointer shrink-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-emerald-600";
          const numText = String(idx + 1).padStart(2, "0");
          btn.innerHTML = `
            <span class="pag-num font-display text-sm font-extrabold tabular-nums transition-colors">${numText}</span>
            <span class="pag-bar block h-0.5 w-4 sm:w-5 rounded-full transition-all"></span>
          `;
          btn.addEventListener("click", () => {
            goToSlide(idx);
            restartAutoplayTimer();
          });
          paginationEl.appendChild(btn);
        });
      }

      function updatePaginationUI() {
        const buttons = paginationEl.querySelectorAll("button");
        buttons.forEach((btn, idx) => {
          const isActive = idx === currentIndex;
          const numSpan = btn.querySelector(".pag-num");
          const barSpan = btn.querySelector(".pag-bar");
          btn.setAttribute("aria-current", isActive ? "true" : "false");
          if (isActive) {
            btn.classList.add("bg-emerald-50");
            numSpan.className = "pag-num font-display text-sm font-extrabold tabular-nums text-emerald-700";
            barSpan.className = "pag-bar block h-0.5 w-6 sm:w-7 rounded-full bg-amber-600";
          } else {
            btn.classList.remove("bg-emerald-50");
            numSpan.className = "pag-num font-display text-sm font-extrabold tabular-nums text-slate-500 group-hover:text-slate-900";
            barSpan.className = "pag-bar block h-0.5 w-4 sm:w-5 rounded-full bg-slate-300 group-hover:bg-slate-500";
          }
        });
        const navWrap = paginationEl.parentElement;
        const activeBtn = buttons[currentIndex];
        if (activeBtn && navWrap && navWrap.scrollWidth > navWrap.clientWidth) {
          const targetLeft = activeBtn.offsetLeft - (navWrap.clientWidth / 2) + (activeBtn.clientWidth / 2);
          navWrap.scrollTo({ left: Math.max(0, targetLeft), behavior: "smooth" });
        }
        counterLabelEl.textContent = `${String(currentIndex + 1).padStart(2, "0")} / ${String(SIMOLAT_SQUAD.length).padStart(2, "0")}`;
      }

      function retriggerSlideAnimations() {
        const animEls = slideContentEl.querySelectorAll(".anim-reveal-1, .anim-reveal-2, .anim-reveal-3");
        animEls.forEach((el) => {
          el.style.animation = "none";
          void el.offsetHeight;
          el.style.animation = "";
        });
        elPhotoWrap.style.animation = "none";
        void elPhotoWrap.offsetHeight;
        elPhotoWrap.style.animation = "";
      }

      function renderPlayer(index) {
        const player = SIMOLAT_SQUAD[index];
        if (!player) return;

        elPosition.textContent = player.position;
        elShirtTag.textContent = `Jersey #${player.number}`;
        elFirstName.textContent = player.firstName;
        elLastName.textContent = player.lastName;
        elAge.textContent = `${player.age} yrs`;
        elFoot.textContent = player.preferredFoot;
        elNationality.textContent = player.nationality;
        elWatermark.textContent = player.number;

        elPhotoImg.src = player.photoUrl;
        elPhotoImg.alt = `Official portrait of ${player.firstName} ${player.lastName}, Simolat Football Academy`;

        const nextPlayer = SIMOLAT_SQUAD[(index + 1) % SIMOLAT_SQUAD.length];
        if (nextPlayer) preloadPhoto(nextPlayer.photoUrl);

        elSpeedVal.textContent = String(player.stats.pace);
        elDribbleVal.textContent = String(player.stats.dribbling);
        elShotVal.textContent = String(player.stats.shooting);

        elSpeedBar.style.transform = "scaleX(0)";
        elDribbleBar.style.transform = "scaleX(0)";
        elShotBar.style.transform = "scaleX(0)";

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            elSpeedBar.style.transform = `scaleX(${Math.max(0, Math.min(100, player.stats.pace)) / 100})`;
            elDribbleBar.style.transform = `scaleX(${Math.max(0, Math.min(100, player.stats.dribbling)) / 100})`;
            elShotBar.style.transform = `scaleX(${Math.max(0, Math.min(100, player.stats.shooting)) / 100})`;
          });
        });

        retriggerSlideAnimations();
        updatePaginationUI();
      }

      function goToSlide(index) {
        const total = SIMOLAT_SQUAD.length;
        currentIndex = ((index % total) + total) % total;
        renderPlayer(currentIndex);
      }

      function nextSlide() { goToSlide(currentIndex + 1); }
      function prevSlide() { goToSlide(currentIndex - 1); }

      function startAutoplayTimer() {
        stopAutoplayTimer();
        if (!autoplayEnabled || isHovered) return;
        autoplayTimer = window.setInterval(nextSlide, AUTOPLAY_INTERVAL_MS);
      }

      function stopAutoplayTimer() {
        if (autoplayTimer !== null) {
          window.clearInterval(autoplayTimer);
          autoplayTimer = null;
        }
      }

      function restartAutoplayTimer() {
        stopAutoplayTimer();
        startAutoplayTimer();
      }

      function isSliderFullscreen() {
        const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
        return nativeFsEl === sliderEl || sliderEl.classList.contains("theater-fullscreen");
      }

      function updateFullscreenBtn() {
        if (!btnFullscreen) return;
        const active = isSliderFullscreen();
        btnFullscreen.setAttribute("aria-pressed", active ? "true" : "false");
        btnFullscreen.setAttribute("aria-label", active ? "Exit full screen mode" : "Toggle full screen mode");
        btnFullscreen.innerHTML = active
          ? '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg><span>Exit full screen</span>'
          : '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg><span>Full screen</span>';
      }

      async function toggleFullscreen() {
        const nativeFsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
        if (nativeFsEl === sliderEl) {
          try {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            else if (document.msExitFullscreen) document.msExitFullscreen();
          } catch (_) {}
          sliderEl.classList.remove("theater-fullscreen");
          updateFullscreenBtn();
          return;
        }
        if (sliderEl.classList.contains("theater-fullscreen")) {
          sliderEl.classList.remove("theater-fullscreen");
          updateFullscreenBtn();
          return;
        }
        const reqFs = sliderEl.requestFullscreen || sliderEl.webkitRequestFullscreen || sliderEl.msRequestFullscreen;
        if (typeof reqFs === "function") {
          try {
            const res = reqFs.call(sliderEl);
            if (res && typeof res.then === "function") await res;
            updateFullscreenBtn();
            return;
          } catch (_) {}
        }
        sliderEl.classList.add("theater-fullscreen");
        updateFullscreenBtn();
      }

      btnPrev.addEventListener("click", () => { prevSlide(); restartAutoplayTimer(); });
      btnNext.addEventListener("click", () => { nextSlide(); restartAutoplayTimer(); });

      btnAutoplay.addEventListener("click", () => {
        autoplayEnabled = !autoplayEnabled;
        btnAutoplay.textContent = autoplayEnabled ? "⏸ Pause Auto" : "▶ Auto Play";
        if (autoplayEnabled) startAutoplayTimer();
        else stopAutoplayTimer();
      });

      function loadScriptOnce(src) {
        return new Promise((resolve, reject) => {
          const existing = document.querySelector(`script[src="${src}"]`);
          if (existing) {
            if (window.jspdf && window.jspdf.jsPDF) {
              resolve();
            } else {
              existing.addEventListener("load", () => resolve(), { once: true });
              existing.addEventListener("error", () => reject(new Error("Script load failed")), { once: true });
            }
            return;
          }
          const s = document.createElement("script");
          s.src = src;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => reject(new Error("Script load failed"));
          document.head.appendChild(s);
        });
      }

      async function exportSquadRosterPDF() {
        if (!btnExportPdf) return;
        btnExportPdf.disabled = true;
        if (btnExportPdfLabel) btnExportPdfLabel.textContent = "Generating PDF...";
        try {
          if (!window.jspdf || !window.jspdf.jsPDF) {
            await loadScriptOnce("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js");
          }
          if (!window.jspdf || !window.jspdf.jsPDF) {
            throw new Error("jsPDF unavailable");
          }
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
          const pageW = doc.internal.pageSize.getWidth();
          const margin = 12;
          const contentW = pageW - margin * 2;

          doc.setFillColor(10, 10, 10);
          doc.rect(0, 0, pageW, 30, "F");
          doc.setFillColor(212, 175, 55);
          doc.rect(0, 30, pageW, 2, "F");

          doc.setTextColor(212, 175, 55);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(16);
          doc.text("SIMOLAT FOOTBALL ACADEMY", margin, 13);

          doc.setTextColor(0, 255, 102);
          doc.setFontSize(9.5);
          doc.text("OFFICIAL FIRST TEAM ROSTER · 23 PLAYERS", margin, 20);

          doc.setTextColor(203, 213, 225);
          doc.setFont("helvetica", "normal");
          doc.setFontSize(8);
          doc.text(`Ikoyi Lagos & Isokun Ilesha • Generated ${new Date().toLocaleDateString("en-GB")}`, margin, 26);

          const gkCount = SIMOLAT_SQUAD.filter((p) => p.position.includes("(GK)")).length;
          const defCount = SIMOLAT_SQUAD.filter((p) => /\((CB|RB|LB)\)/.test(p.position)).length;
          const midCount = SIMOLAT_SQUAD.filter((p) => /\((CDM|CM|CAM)\)/.test(p.position)).length;
          const fwdCount = SIMOLAT_SQUAD.length - gkCount - defCount - midCount;

          let y = 38;
          doc.setFillColor(236, 253, 245);
          doc.setDrawColor(16, 185, 129);
          doc.roundedRect(margin, y, contentW, 10, 2, 2, "FD");
          doc.setTextColor(6, 95, 70);
          doc.setFont("helvetica", "bold");
          doc.setFontSize(8.5);
          doc.text(`SQUAD DEPTH: ${SIMOLAT_SQUAD.length} PLAYERS   |   GK: ${gkCount}   ·   DEF: ${defCount}   ·   MID: ${midCount}   ·   FWD / WNG: ${fwdCount}`, margin + 4, y + 6.5);

          y += 15;
          const colX = {
            idx: margin + 2,
            no: margin + 10,
            name: margin + 23,
            pos: margin + 68,
            age: margin + 114,
            foot: margin + 125,
            nat: margin + 141,
            pace: margin + 164,
            drib: margin + 174,
            shot: margin + 183
          };

          const drawTableHeader = (topY) => {
            doc.setFillColor(15, 23, 42);
            doc.rect(margin, topY, contentW, 8, "F");
            doc.setTextColor(250, 204, 21);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(7.5);
            doc.text("#", colX.idx, topY + 5.4);
            doc.text("SHIRT", colX.no, topY + 5.4);
            doc.text("PLAYER NAME", colX.name, topY + 5.4);
            doc.text("POSITION", colX.pos, topY + 5.4);
            doc.text("AGE", colX.age, topY + 5.4);
            doc.text("FOOT", colX.foot, topY + 5.4);
            doc.text("NATION", colX.nat, topY + 5.4);
            doc.text("PAC", colX.pace, topY + 5.4);
            doc.text("DRI", colX.drib, topY + 5.4);
            doc.text("SHO", colX.shot, topY + 5.4);
            return topY + 8;
          };

          y = drawTableHeader(y);
          const rowH = 8.8;

          SIMOLAT_SQUAD.forEach((p, i) => {
            if (y + rowH > 280) {
              doc.addPage();
              y = drawTableHeader(14);
            }
            doc.setFillColor(i % 2 === 0 ? 248 : 255, i % 2 === 0 ? 250 : 255, i % 2 === 0 ? 252 : 255);
            doc.setDrawColor(226, 232, 240);
            doc.rect(margin, y, contentW, rowH, "FD");

            doc.setTextColor(100, 116, 139);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(7.8);
            doc.text(String(i + 1).padStart(2, "0"), colX.idx, y + 6);

            doc.setTextColor(4, 120, 87);
            doc.setFont("helvetica", "bold");
            doc.text(`#${p.number}`, colX.no, y + 6);

            doc.setTextColor(15, 23, 42);
            doc.text(`${p.firstName} ${p.lastName}`, colX.name, y + 6);

            doc.setTextColor(51, 65, 85);
            doc.setFont("helvetica", "normal");
            doc.text(p.position, colX.pos, y + 6);
            doc.text(String(p.age), colX.age, y + 6);
            doc.text(p.preferredFoot, colX.foot, y + 6);
            doc.text(p.nationality, colX.nat, y + 6);

            doc.setFont("helvetica", "bold");
            doc.setTextColor(5, 150, 105);
            doc.text(String(p.stats.pace), colX.pace, y + 6);
            doc.setTextColor(180, 83, 9);
            doc.text(String(p.stats.dribbling), colX.drib, y + 6);
            doc.setTextColor(15, 23, 42);
            doc.text(String(p.stats.shooting), colX.shot, y + 6);

            y += rowH;
          });

          doc.setFont("helvetica", "normal");
          doc.setFontSize(7.5);
          doc.setTextColor(100, 116, 139);
          doc.text("Simolat Football Academy • Official First Team Roster (23 Players) • admissions@simolatfootballacademy.ng", margin, 288);

          doc.save("Simolat_First_Team_23_Player_Roster.pdf");
          if (btnExportPdfLabel) {
            btnExportPdfLabel.textContent = "✓ PDF Exported";
            window.setTimeout(() => {
              if (btnExportPdfLabel) btnExportPdfLabel.textContent = "Export Squad PDF";
            }, 2200);
          }
        } catch (err) {
          if (btnExportPdfLabel) {
            btnExportPdfLabel.textContent = "Retry Export PDF";
            window.setTimeout(() => {
              if (btnExportPdfLabel) btnExportPdfLabel.textContent = "Export Squad PDF";
            }, 2500);
          }
        } finally {
          btnExportPdf.disabled = false;
        }
      }

      if (btnFullscreen) btnFullscreen.addEventListener("click", toggleFullscreen);
      if (btnExportPdf) btnExportPdf.addEventListener("click", exportSquadRosterPDF);
      document.addEventListener("fullscreenchange", updateFullscreenBtn);
      document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);

      sliderEl.addEventListener("mouseenter", () => { isHovered = true; stopAutoplayTimer(); });
      sliderEl.addEventListener("mouseleave", () => { isHovered = false; startAutoplayTimer(); });

      sliderEl.setAttribute("tabindex", "0");
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && sliderEl.classList.contains("theater-fullscreen")) {
          sliderEl.classList.remove("theater-fullscreen");
          updateFullscreenBtn();
        } else if (e.key === "ArrowRight") { nextSlide(); restartAutoplayTimer(); }
        else if (e.key === "ArrowLeft") { prevSlide(); restartAutoplayTimer(); }
      });

      sliderEl.addEventListener("touchstart", (e) => {
        if (!e.touches || !e.touches[0]) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        stopAutoplayTimer();
      }, { passive: true });

      sliderEl.addEventListener("touchend", (e) => {
        if (!e.changedTouches || !e.changedTouches[0]) return;
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX < 0) nextSlide();
          else prevSlide();
        }
        startAutoplayTimer();
      }, { passive: true });

      elPhotoImg.addEventListener("error", () => {
        elPhotoImg.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
            <rect width="600" height="800" fill="#F1F5F9"/>
            <circle cx="300" cy="260" r="95" fill="#CBD5E1"/>
            <path d="M130 720 C130 500 470 500 470 720 Z" fill="#CBD5E1"/>
            <text x="300" y="765" text-anchor="middle" fill="#065F46" font-family="sans-serif" font-size="22" font-weight="bold">SIMOLAT ACADEMY</text>
          </svg>`
        );
      });

      buildPagination();
      renderPlayer(0);
      startAutoplayTimer();
    })();
  </script>
